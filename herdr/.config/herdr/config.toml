onboarding = false

[keys]
# Prefix is ctrl+a. Ghostty rewrites cmd+a to \x01 so the ergonomic combo
# is cmd+a but TUIs see ctrl+a. Trade-off: vim's ctrl+a (increment number)
# is shadowed inside herdr panes.
prefix = "ctrl+a"
reload_config = "R"
rename_tab = ","
rename_pane = "."

# Pane focus — within current tab. Brackets for L/R, arrows for U/D.
# Herdr has no "cycle pane" action, only directional focus.
focus_pane_left  = "alt+["
focus_pane_right = "alt+]"
focus_pane_up    = "alt+up"
focus_pane_down  = "alt+down"

# Tab cycling — within current workspace. Shift adds one tier.
previous_tab = "shift+alt+["
next_tab     = "shift+alt+]"

# Workspace cycling — Ghostty rewrites cmd+shift+left/right to the
# ctrl+alt+left/right CSI sequence for us.
previous_workspace = "ctrl+alt+left"
next_workspace     = "ctrl+alt+right"

# Indexed jumps: ctrl+1..9 = workspaces.
[keys.indexed]
workspaces = "ctrl"
tabs       = ""

[theme]
name = "nord"

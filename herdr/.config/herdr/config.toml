onboarding = false

[keys]
# Prefix is ctrl+a. Ghostty rewrites cmd+a to \x01 so the ergonomic combo
# is cmd+a but TUIs see ctrl+a. Trade-off: vim's ctrl+a (increment number)
# is shadowed inside herdr panes.
prefix = "ctrl+a"
reload_config = "R"
rename_tab = ","
rename_pane = "."

# Workspace / tab cycling — direct (no prefix), from terminal mode.
previous_workspace = "ctrl+alt+["
next_workspace     = "ctrl+alt+]"
previous_tab       = "alt+["
next_tab           = "alt+]"

# Indexed jumps: ctrl+shift+1..9 = workspaces, ctrl+1..9 = tabs.
[keys.indexed]
workspaces = "ctrl+shift"
tabs       = "ctrl"

[theme]
name = "nord"

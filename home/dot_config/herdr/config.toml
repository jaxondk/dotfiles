onboarding = false

[keys]
# Prefix is ctrl+b. Ghostty rewrites cmd+a to \x02 so the ergonomic combo
# is still cmd+a but TUIs see ctrl+b. Picked ctrl+b over ctrl+a so \x01
# stays free for readline beginning-of-line (Ghostty's default cmd+left
# sends \x01; with a ctrl+a prefix that collided with herdr's leader and
# dropped us into nav mode on cmd+left).
# Trade-off: vim's ctrl+b (page up) is shadowed inside herdr panes.
prefix = "ctrl+b"

# herdr now requires unambiguous prefix-scoped syntax for anything that could
# collide with normal typing (bare "R", ",", "." get silently disabled as of
# herdr 0.8.2 — `herdr config check` flags this). Explicit prefix+ below.
reload_config = "prefix+shift+r"
rename_tab = "prefix+,"
rename_pane = "prefix+."

# Pane focus is built-in via the prefix: cmd+a Tab cycles, cmd+a h/j/k/l
# or arrows do directional. No bindings needed.

# Tab cycling — direct, no prefix. (Also works in nav mode.)
previous_tab = "alt+["
next_tab     = "alt+]"

# Workspace cycling — one tier up.
previous_workspace = "shift+alt+["
next_workspace     = "shift+alt+]"

# Indexed workspace jumps are built-in via prefix: cmd+a 1..9.

[theme]
name = "nord"
